  .status-msg { font-size: 0.85rem; margin-top: 10px; }

  .status-msg.err { color: var(--danger); }

  table.log { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
  table.log th, table.log td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  table.log th { color: var(--text-soft); font-weight: 500; font-size: 0.75rem; text-transform: none; }
  table.log tr.not-used td { color: var(--text-soft); font-style: italic; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; }
  .badge.daily { background: var(--ok-bg); color: var(--ok-text); }
  .badge.biweekly { background: #e6ddf0; color: #5b4a7a; }
  .badge.notused { background: var(--border); color: var(--text-soft); }
  .empty-state { color: var(--text-soft); font-size: 0.88rem; padding: 24px 0; text-align: center; }

  .ref-group h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px; }
  .ref-group .cite { color: var(--text-soft); font-size: 0.78rem; margin-bottom: 10px; }

  details.ref summary { cursor: pointer; padding: 8px 4px; font-size: 0.93rem; font-weight: 500; list-style: none; }

  details.ref summary::before { content: "+"; color: var(--accent-strong); font-weight: 600; margin-right: 10px; display: inline-block; width: 12px; }

  details.ref .ref-body { padding: 2px 4px 14px 26px; font-size: 0.88rem; color: var(--text-soft); }
  input.search-bar { width: 100%; font-size: 0.95rem; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); margin: 4px 0 22px; }

  footer.note { margin-top: 50px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-soft); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

function nowTimeStr(){ var d = new Date(); return d.toTimeString().slice(0,5); }
function fmtDate(s){ if(!s) return ""; var p = s.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }
function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function getInitials(){ try { return localStorage.getItem("cb_initials") || ""; } catch(e){ return ""; } }
function setInitials(v){ try { localStorage.setItem("cb_initials", v); } catch(e){} }

// ---------- router ----------
var TABS = [
  {path:"#/", label:"Home"},
  {path:"#/checklist", label:"Self-Audit Checklist"},
  {path:"#/reference", label:"Full Reference"},
  {path:"#/log/basin", label:"Foot Basin"}
];

function renderTabs(){
  var hash = location.hash || "#/";
  var html = TABS.map(function(t){
    var active = (t.path === "#/" ? hash === "#/" || hash === "" : hash.indexOf(t.path) === 0);
    return '<a class="tab' + (active ? ' active' : '') + '" href="' + t.path + '">' + t.label + '</a>';
  }).join("");
  document.getElementById("tabs").innerHTML = html;
}

function route(){
  renderTabs();
  var hash = location.hash || "#/";
  var app = document.getElementById("app");
  if (hash === "#/" || hash === "") { renderHome(app); }
  else if (hash === "#/checklist") { renderChecklist(app); }
  else if (hash === "#/reference") { renderReference(app); }
  else if (hash.indexOf("#/log/") === 0) {
    var rest = hash.replace("#/log/","");
    var key = rest.split("?")[0];
    var qs = rest.indexOf("?") >= 0 ? rest.slice(rest.indexOf("?")+1) : "";
    var presetStation = "";
    qs.split("&").forEach(function(pair){
      var kv = pair.split("=");
      if (kv[0] === "station") presetStation = decodeURIComponent(kv[1] || "");
    });
    if (ROUTES[key]) renderLog(app, key, presetStation);
    else renderHome(app);
  } else {
    renderHome(app);
  }
}
window.addEventListener("hashchange", route);

// ---------- home ----------
function renderHome(app){
  app.innerHTML =
    '<h1>Nails — TDLR Compliance Center</h1>' +
    '<p class="lede">Everything the nail service category needs to stay compliant with Texas Department of Licensing and Regulation (TDLR) health and safety rules — a running self-audit checklist, plus the cleaning logs TDLR requires you to keep on record. Logs sync live across every device and stay available for at least 60 days.</p>' +
    '<div class="card-grid">' +
      '<a class="card" href="#/checklist"><span class="tag">SELF-AUDIT</span><h3>Compliance Checklist</h3><p>Facility, sanitation, tools, postings, and prohibited products — everything TDLR looks for during an inspection.</p></a>' +
      '<a class="card" href="#/reference"><span class="tag">FULL REFERENCE</span><h3>Complete TDLR Guidance</h3><p>Every rule, definition, and requirement for nail services, organized and searchable — not just the checklist version.</p></a>' +
      '<a class="card" href="#/log/basin"><span class="tag">REQUIRED LOG</span><h3>Foot Basin</h3><p>Non-whirlpool basin cleaning records, §83.108(f)-(g).</p></a>' +
    '</div>' +
    '<footer class="note">Built for Cio Bela Multi-Service Salon. This tool organizes recordkeeping; it does not replace reading 16 Texas Administrative Code Chapter 83 or TDLR\'s own forms and guidance.</footer>';
}

// ---------- checklist ----------
function renderChecklist(app){
  app.innerHTML = '<h1>Nails Self-Audit Checklist</h1>' +
    '<p class="lede">A running checklist of TDLR health and safety standards for nail services. This is an internal tool to help you stay ready for inspection — it is not one of the official records TDLR requires you to produce.</p>' +
    '<div class="rule-note">Check off an item once you\'ve confirmed it in the salon. Checks are shared across every device and stay checked until someone unchecks them &mdash; treat this as a living state, not a dated log.</div>' +
    '<div id="checklist-body">Loading…</div>';

  var body = document.getElementById("checklist-body");
  var itemIndex = 0;
  var allItems = [];
  CHECKLIST_GROUPS.forEach(function(g){ g.items.forEach(function(txt){ allItems.push({id: "i"+itemIndex, group: g.title, cite: g.cite, txt: txt}); itemIndex++; }); });

  var docRef = doc(db, "nails/checklist");
  onSnapshot(docRef, function(snap){
      var data = (snap.exists() && snap.data()) || {};
      var checked = data.items || {};
      var html = "";
      var byGroup = {};
      allItems.forEach(function(it){ (byGroup[it.group] = byGroup[it.group] || []).push(it); });
      CHECKLIST_GROUPS.forEach(function(g){
        html += '<section class="group"><h2>' + esc(g.title) + '</h2><div class="rule-cite" style="color:var(--text-soft);font-size:.78rem;margin-bottom:6px;">' + esc(g.cite) + (g.note ? ' &middot; ' + esc(g.note) : '') + '</div>';
        byGroup[g.title].forEach(function(it){
          var isChecked = !!(checked[it.id] && checked[it.id].on);
          html += '<div class="item' + (isChecked ? ' checked' : '') + '">' +
            '<input type="checkbox" id="cb_' + it.id + '" ' + (isChecked ? 'checked' : '') + ' data-id="' + it.id + '">' +
            '<label for="cb_' + it.id + '">' + esc(it.txt) + '</label>' +
            '</div>';
        });
        html += '</section>';
      });
      body.innerHTML = html;
      body.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var id = cb.getAttribute('data-id');
          var merged = {};
          merged[id] = { on: cb.checked, updatedAt: new Date().toISOString() };
          setDoc(docRef, { items: Object.assign({}, checked, merged) });
        });
      });
    }, function(err){
      body.innerHTML = '<p>Could not load checklist right now (' + esc(err.code || 'error') + '). Try reloading.</p>';
    });
}

// ---------- full reference ----------
function renderReference(app){
  app.innerHTML = '<h1>Full TDLR Reference — Nails</h1>' +
    '<p class="lede">Every rule, definition, and piece of guidance TDLR publishes for nail services — not just the checklist version.</p>' +
    '<input type="search" class="search-bar" id="ref-search" placeholder="Search rules — e.g. \u201cbleach,\u201d \u201cgloves,\u201d \u201cblood\u201d">' +
    '<div id="reference-body"></div>';
  var input = document.getElementById('ref-search');
  function draw(qRaw){
    var q = (qRaw || '').toLowerCase().trim();
    var body = document.getElementById('reference-body');
    var html = '';
    var any = false;
    REFERENCE_SECTIONS.forEach(function(sec){
      var matches = sec.entries.filter(function(e){
        if (!q) return true;
        return (e.rule + ' ' + e.text + ' ' + sec.title + ' ' + sec.cite).toLowerCase().indexOf(q) !== -1;
      });
      if (!matches.length) return;
      any = true;
      html += '<div class="ref-group"><h2>' + esc(sec.title) + '</h2><div class="cite">' + esc(sec.cite) + '</div>';
      matches.forEach(function(e){
        html += '<details class="ref"' + (q ? ' open' : '') + '><summary>' + esc(e.rule) + '</summary><div class="ref-body">' + esc(e.text) + '</div></details>';
      });
      html += '</div>';
    });
    body.innerHTML = any ? html : '<div class="empty-state">No matches for &ldquo;' + esc(qRaw) + '&rdquo;.</div>';
  }
  draw('');
  input.addEventListener('input', function(){ draw(input.value); });
}

// ---------- log pages ----------
function renderLog(app, key, presetStation){
  var r = ROUTES[key];
  app.innerHTML =
    '<h1>' + esc(r.label) + '</h1>' +
    (presetStation ? '<div class="rule-note" style="background:var(--surface);border-left-color:var(--accent-strong);">Showing <b>' + esc(presetStation) + '</b> only. <a href="#/log/' + key + '">View all stations</a></div>' : '') +
    '<div class="rule-note"><b>' + esc(r.cite) + '</b> — ' + esc(r.desc) + ' Records must be retained and available on request for at least 60 days.</div>' +
    '<form class="entry" id="entry-form">' +
      '<div class="field-row">' +
        '<div class="field"><label for="f_date">Date</label><input type="date" id="f_date"></div>' +
        '<div class="field"><label for="f_time">Time</label><input type="time" id="f_time"></div>' +
        '<div class="field"><label for="f_station">Station</label><input type="text" id="f_station" list="stationList" placeholder="' + esc(r.stationPlaceholder || "e.g. Station 1") + '"></div>' +
        '<div class="field"><label for="f_initials">Initials</label><input type="text" id="f_initials" placeholder="e.g. SD"></div>' +
      '</div>' +
      '<datalist id="stationList"></datalist>' +
      '<div class="checkline"><input type="checkbox" id="f_not_used"><label for="f_not_used">Not used today (mark this station as not in service — required if skipped)</label></div>' +
      '<div class="field" style="margin-bottom:14px;"><label for="f_notes">Notes (optional)</label><textarea id="f_notes" placeholder="Anything worth noting for this entry"></textarea></div>' +
      '<button type="submit" class="primary">Save entry</button>' +
      '<div class="status-msg" id="entry-status"></div>' +
    '</form>' +
    '<div class="filter-bar">' +
      '<select id="filter-range"><option value="60">Last 60 days</option><option value="7">Last 7 days</option><option value="all">All entries</option></select>' +
      '<select id="filter-station"><option value="">All stations</option></select>' +
    '</div>' +
    '<div id="log-table"><div class="empty-state">Loading records…</div></div>';

  document.getElementById("f_date").value = todayStr();
  document.getElementById("f_time").value = nowTimeStr();
  document.getElementById("f_initials").value = getInitials();
  if (presetStation) document.getElementById("f_station").value = presetStation;

  var notUsedBox = document.getElementById("f_not_used");
  var toggleFields = ["f_time","f_station"];
  notUsedBox.addEventListener("change", function(){
    var disabled = notUsedBox.checked;
    toggleFields.forEach(function(id){ document.getElementById(id).disabled = disabled; });
  });

  var allEntries = [];
  var stationPreApplied = false;
  var logQuery = query(col(key), orderBy("date", "desc"), limit(500));
  onSnapshot(logQuery, function(snap){
    allEntries = snap.docs.map(function(d){ return Object.assign({_id: d.id}, d.data()); });
    populateStationFilter(allEntries);
    renderTable(allEntries);
  }, function(err){
    document.getElementById("log-table").innerHTML = '<p>Could not load records (' + esc(err.code||'error') + ').</p>';
  });

  function populateStationFilter(entries){
    var sel = document.getElementById("filter-station");
    var current = sel.value;
    var stations = Array.from(new Set(entries.map(function(e){ return e.station; }).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">All stations</option>' + stations.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('');
    if (presetStation && !stationPreApplied) {
      sel.value = presetStation;
      stationPreApplied = true;
    } else {
      sel.value = current;
    }
    var dl = document.getElementById("stationList");
    if (dl) dl.innerHTML = stations.map(function(s){ return '<option value="'+esc(s)+'">'; }).join('');
  }

  function renderTable(entries){
    var range = document.getElementById("filter-range").value;
    var stationFilter = document.getElementById("filter-station").value;
    var cutoff = null;
    if (range !== "all") {
      var d = new Date(); d.setDate(d.getDate() - parseInt(range,10));
      cutoff = d.toISOString().slice(0,10);
    }
    var filtered = entries.filter(function(e){
      if (cutoff && e.date < cutoff) return false;
      if (stationFilter && e.station !== stationFilter) return false;
      return true;
    });
    var holder = document.getElementById("log-table");
    if (!filtered.length) {
      holder.innerHTML = '<div class="empty-state">No entries in this range yet.</div>';
      return;
    }
    var rows = filtered.map(function(e){
      var badge = e.notUsed ? '<span class="badge notused">Not used</span>' : '<span class="badge daily">Daily</span>';
      return '<tr class="' + (e.notUsed ? 'not-used' : '') + '">' +
        '<td>' + esc(fmtDate(e.date)) + '</td>' +
        '<td>' + esc(e.time||'') + '</td>' +
        '<td>' + esc(e.station || '—') + '</td>' +
        '<td>' + badge + '</td>' +
        '<td>' + esc(e.initials||'') + '</td>' +
        '<td>' + esc(e.notes||'') + '</td>' +
        '</tr>';
    }).join("");
    holder.innerHTML = '<table class="log"><thead><tr><th>Date</th><th>Time</th><th>Station</th><th>Type</th><th>By</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  document.getElementById("filter-range").addEventListener("change", function(){ renderTable(allEntries); });
  document.getElementById("filter-station").addEventListener("change", function(){ renderTable(allEntries); });

  document.getElementById("entry-form").addEventListener("submit", function(e){
    e.preventDefault();
    var statusEl = document.getElementById("entry-status");
    var notUsed = notUsedBox.checked;
    var station = document.getElementById("f_station").value.trim();
    var initials = document.getElementById("f_initials").value.trim();
    if (!notUsed && !station) { statusEl.textContent = "Enter a station or mark not used today."; statusEl.className = "status-msg err"; return; }
    if (!initials) { statusEl.textContent = "Initials are required."; statusEl.className = "status-msg err"; return; }
    setInitials(initials);
    var entry = {
      date: document.getElementById("f_date").value || todayStr(),
      time: notUsed ? "" : (document.getElementById("f_time").value || ""),
      station: notUsed ? (station || "All stations") : station,
      initials: initials,
      notes: document.getElementById("f_notes").value.trim(),
      notUsed: notUsed,
      createdAt: new Date().toISOString()
    };
    var btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    addDoc(col(key), entry).then(function(){
      statusEl.textContent = "Saved.";
      statusEl.className = "status-msg ok";
      document.getElementById("f_notes").value = "";
      notUsedBox.checked = false;
      toggleFields.forEach(function(id){ document.getElementById(id).disabled = false; });
      document.getElementById("f_time").value = nowTimeStr();
      btn.disabled = false;
    }).catch(function(err){
      statusEl.textContent = "Could not save (" + (err.code || "error") + "). Try again.";
      statusEl.className = "status-msg err";
      btn.disabled = false;
    });
  });
}


// ---------- init ----------
route();
})();
</script>
</body>
</html>
